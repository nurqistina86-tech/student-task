<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY NEW STUDENT DASHBOARD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Task Management</h1>
        <p>Manage your tasks easily!</p>
    </header>

    <main>

        <h2>Dashboard</h2>


        <div class="stats-container">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </div>


        <h2>My Tasks</h2>

        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button onclick="addTask()">Add Task</button>
        </div>

    
        <ul id="taskList"></ul>

    </main>

    <script src="script.js"></script>

</body>
</html>
